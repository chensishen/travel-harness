[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-harness"
version = "0.1.0"
description = "Source-grounded cultural travel research and document generation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.32,<1",
  "pydantic-settings>=2.6,<3", "httpx>=0.28,<1",
  "mcp>=1.12,<2", "trafilatura>=2,<3", "pymilvus>=3.0.2,<4",
  "python-pptx>=1,<2", "python-docx>=1.1,<2", "Pillow>=11,<13",
  "pypdf>=6,<7",
  "tenacity>=9,<10", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
